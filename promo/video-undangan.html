<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video undangan 15 detik</title>
<!--
  Video undangan 15 detik (1080×1920) dari undangan pelanggan, untuk Status WA / Story IG (fitur Eksklusif).
  Pratinjau : promo/video-undangan.html?u=<slug>
  Render MP4: node promo/render.mjs --halaman="promo/video-undangan.html?u=<slug>" --keluaran=promo/hasil/video-<slug>.mp4
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; height: 100%; }
  #panggung { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: #111; font-family: 'Jost', system-ui, sans-serif; }
  #panggung iframe { position: absolute; left: 0; top: 0; width: 375px; height: 667px; border: 0; transform-origin: 0 0; transform: scale(2.88); }
  .ketuk { position: absolute; z-index: 5; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); border: 5px solid rgba(255, 255, 255, 0.95); opacity: 0; }
  .akhir { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 150px 70px 120px; text-align: center; color: #fff; opacity: 0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.72) 38%, rgba(0, 0, 0, 0.85) 100%); }
  .akhir .kecil { font-size: 36px; opacity: 0.85; }
  .akhir .tautan { margin-top: 10px; font-size: 46px; font-weight: 600; word-break: break-all; }
  .akhir .merek { margin-top: 44px; font-size: 26px; letter-spacing: 0.08em; opacity: 0.6; }
</style>
</head>
<body>
<div id="panggung">
  <div class="ketuk" id="ketuk"></div>
  <div class="akhir" id="akhir">
    <p class="kecil">Buka undangan lengkap:</p>
    <p class="tautan" id="tautan"></p>
    <p class="merek">undangan digital oleh <span data-merek></span></p>
  </div>
</div>
<script src="../config.js"></script>
<script src="video-undangan.js"></script>
</body>
</html>
